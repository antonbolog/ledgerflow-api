name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Quality, tests and images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # One disposable Compose project per run attempt; GitHub-hosted runner
      # disposal is the cleanup boundary for its containers and volumes.
      COMPOSE_PROJECT_NAME: ledgerflow-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install from a clean checkout
        run: make install

      - name: Code quality
        run: make quality

      - name: Unit tests
        run: make test-unit

      - name: Integration tests (including Feature and Architecture)
        run: make test-integration

      - name: Build Laravel production runtime image
        run: make build-runtime

      - name: Build Laravel Nginx image
        run: make build-nginx

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true
