name: CI

# CI consumes the same public Make interface as local development. Guard,
# database-isolation, application-validation, and image contracts live behind
# `make ci`; this workflow owns only clean-checkout orchestration and diagnostics.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install from a clean checkout
        run: make install

      - name: Validate CI contract
        run: make ci

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true
