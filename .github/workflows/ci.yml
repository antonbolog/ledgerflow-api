name: CI

# Every validation step below is a public Make target. Composer, Pest, Pint,
# Rector, PHPStan and the database commands appear nowhere in this file: if a
# check cannot be expressed as a Make target, it is not a check this project
# supports. That is the contract the development environment specification
# demands, and it is what stops CI and local development from drifting apart.
#
# The only non-`make` steps are the enumerated exceptions from AGENTS.md:
# contract assertions ABOUT the Makefile's guards, the two image builds, and
# failure diagnostics. None of them validate application code.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # Proves the clean-checkout contract: a runner with only Docker and Make
      # reaches a working stack. No PHP, no Composer, no setup-php action.
      - name: Install from a clean checkout
        run: make install

      - name: Validate
        run: make check

      # --- Contract assertions about the Makefile itself -------------------
      # These are not application validation; they verify the guards that stop
      # a destructive command from running unconfirmed. They are safe in CI for
      # the same reason they are safe locally: the guards refuse, so nothing is
      # destroyed, and the databases involved are the runner's own throwaway
      # containers.

      - name: Destructive targets refuse without confirmation
        run: |
          set -euo pipefail

          # Capture combined output inside the `if` condition, then match
          # separately. Piping the guarded command into grep does NOT work under
          # pipefail: make exits 2, pipefail propagates that as the pipeline's
          # status, and the step fails even when the message matched. Assigning
          # inside `if` also keeps `set -e` from aborting on the expected
          # non-zero exit.
          assert_refuses() {
            local target="$1" expected="$2" output

            if output=$(make "$target" 2>&1); then
              echo "::error::make $target succeeded without confirmation"
              echo "$output"
              return 1
            fi

            if ! grep -q -- "$expected" <<<"$output"; then
              echo "::error::make $target refused, but without the documented message '$expected'"
              echo "$output"
              return 1
            fi

            echo "make $target refused as documented."
          }

          assert_refuses destroy  'CONFIRM=destroy'
          assert_refuses db-reset 'CONFIRM=db-reset'

      - name: Database safety guard refuses a non-local target
        run: |
          set -euo pipefail

          # Restored even if an assertion fails, so a failure cannot leave the
          # job with a poisoned .env or a stale app container for later steps.
          #
          # Restoration is an asserted postcondition, not best effort. There is
          # no `|| true`: later steps run `make check` and build images against
          # this container, and continuing with an unhealthy one would produce a
          # misleading failure somewhere else. The explicit `exit 1` is required
          # because an EXIT trap does not otherwise change the shell's status —
          # dropping `|| true` alone would still swallow the failure.
          restore() {
            local status=$?

            if [ -f .env.ci-backup ]; then
              mv -f .env.ci-backup .env

              if ! docker compose up -d --force-recreate --wait app; then
                echo "::error::could not restore a healthy app container after the database-guard assertion"
                exit 1
              fi
            fi

            exit "$status"
          }
          trap restore EXIT

          # Point the app container at a database that is not on the allowlist,
          # then confirm every mutating target refuses. The host below does not
          # resolve from the runner, so even a total guard failure could not
          # reach real data — the command would error on connection instead.
          cp .env .env.ci-backup
          sed -i 's/^DB_HOST=postgres$/DB_HOST=db.invalid.example/' .env

          # --wait so the assertions cannot race container startup: without it
          # `make db-migrate` can reach a container that is up but not yet
          # accepting exec, and the failure would look like a guard failure.
          docker compose up -d --force-recreate --wait app

          assert_guard_refuses() {
            local target="$1" output
            local expected='REFUSING: this target may only touch local project databases'

            if output=$(make "$target" 2>&1); then
              echo "::error::make $target ran against a non-allowlisted database"
              echo "$output"
              return 1
            fi

            if ! grep -q -- "$expected" <<<"$output"; then
              echo "::error::make $target failed, but not via the database guard"
              echo "$output"
              return 1
            fi

            echo "make $target refused a non-allowlisted host."
          }

          assert_guard_refuses db-migrate
          assert_guard_refuses db-seed

      - name: Development database survives a full check
        run: |
          set -euo pipefail

          # `check` runs the suite, which truncates and re-migrates. It must
          # touch ledgerflow_test only. A marker row in the development database
          # proves the isolation rather than asserting it.
          docker compose exec -T postgres psql -U ledgerflow -d ledgerflow -q -c \
            "CREATE TABLE ci_isolation_marker(note text); INSERT INTO ci_isolation_marker VALUES ('intact');"

          make check

          found=$(docker compose exec -T postgres psql -U ledgerflow -d ledgerflow -tAc \
            "SELECT note FROM ci_isolation_marker;" | tr -d '[:space:]')
          if [ "$found" != "intact" ]; then
            echo "::error::make check mutated the development database"; exit 1
          fi
          echo "Development database untouched by make check."

      # --- Image contract --------------------------------------------------
      # Compose only ever builds the dev target, so without these two steps a
      # broken production or web stage merges green and is discovered at the
      # first deployment attempt, milestones later.

      - name: Build the production image target
        run: docker build --target production -t ledgerflow-api:ci .

      - name: Build the web image target
        run: docker build --target web -t ledgerflow-web:ci .

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=200 || true
