# Ledgerflow web tier.
#
# nginx never executes PHP. It computes a filesystem path and hands that STRING
# to php-fpm over FastCGI, and php-fpm opens it in its own container. The
# project must therefore be present at the SAME absolute path in both
# containers, or SCRIPT_FILENAME resolves to nothing and every request 502s.
#
#   local dev  -> ./ bind-mounted read-only at /var/www/html in both services
#   production -> the `web` image stage copies public/ from the app image
#
# The same file serves both, so local and production nginx behaviour cannot
# drift apart.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Payment payloads are small; this is a deliberate ceiling, not a default.
    client_max_body_size 2m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Front controller ONLY. Restricting execution to index.php means a stray
    # .php file that ever lands under public/ cannot be executed by requesting
    # it; without this, `location ~ \.php$` would happily run it.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        include fastcgi_params;

        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Any other PHP path is refused outright rather than passed to fpm.
    location ~ \.php$ {
        return 404;
    }

    # Dotfiles are never served: this is what keeps a bind-mounted .env
    # unreachable over HTTP in local development.
    location ~ /\. {
        deny all;
    }

    error_page 404 /index.php;
}
