; Ledgerflow php-fpm pool.
;
; Loaded as zz-ledgerflow.conf so it wins over the image's www.conf defaults.

[www]
user = app
group = app

; All interfaces, not 127.0.0.1. nginx reaches php-fpm across a container
; boundary as `app:9000`; binding to loopback would make the pool unreachable
; and every request would fail with a 502.
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; The CLI keeps memory_limit = -1 from php.ini so static analysis can run, but
; a web worker must never inherit that: an unbounded pool turns one runaway
; request into an OOM-killed container. php_admin_value applies to FPM workers
; only and cannot be overridden at runtime by application code.
php_admin_value[memory_limit] = 256M

; Probed by the container health check via cgi-fcgi. Without ping.path the
; pool answers nothing on a bare FastCGI connect and the health check would
; report healthy for a pool that cannot actually serve.
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

; Surface worker output in `docker logs` rather than swallowing it.
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

clear_env = no
