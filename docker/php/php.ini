; Ledgerflow PHP runtime configuration.
;
; Applied to every process built from the application image: php-fpm, the CLI,
; and future worker and scheduler processes.

[PHP]
; Unlimited for the CLI only: static analysis over a Laravel codebase routinely
; exceeds the default, and the failure mode is an out-of-memory abort rather
; than an analysis result. The FPM pool does NOT inherit this — www.conf sets a
; finite php_admin_value[memory_limit] for web workers.
memory_limit = -1

expose_php = Off

; Financial arithmetic is done with bcmath and integer minor units, never
; floats, but keep serialize_precision honest for any JSON that does surface
; a float.
serialize_precision = -1

[Date]
date.timezone = UTC

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Left on so the dev bind mount picks up edits. The production image overrides
; this to 0 when a deployment milestone defines its warm-up and revalidation
; contract; no preload script is configured, deliberately.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
