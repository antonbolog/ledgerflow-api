name: ${COMPOSE_PROJECT_NAME:-ledgerflow}

services:
  web:
    image: nginx:1.30.4-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # Loopback by default: override APP_BIND deliberately to expose it.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Only public/, at the app's path: nginx must never be able to serve .env or the rest of the repository.
      - ./public:/var/www/html/public:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/up || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  app:
    image: ${LEDGERFLOW_APP_IMAGE:-ledgerflow-app:latest}
    build:
      context: .
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      # Optional: docker compose config must work before make install creates .env.
      - path: .env
        required: false
    environment:
      # Deliberately not derived from APP_BIND: the loopback bind is where the port is published,
      # while localhost is the single cookie host the BFF and the API must agree on.
      APP_URL: "http://localhost:${APP_PORT:-8080}"
    volumes:
      - ./:/var/www/html
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET
          cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ledgerflow}
      POSTGRES_USER: ${DB_USERNAME:-ledgerflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ledgerflow}
      # A subdirectory of the mount, so the cluster never initialises outside the volume.
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${DB_USERNAME:-ledgerflow}" -d "${DB_DATABASE:-ledgerflow}"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  scheduler:
    profiles: ["projection"]
    image: ${LEDGERFLOW_APP_IMAGE:-ledgerflow-app:latest}
    build:
      context: .
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/var/www/html
    healthcheck:
      # start_period 75s: schedule:work first ticks at the next minute boundary, up to 60 seconds after start.
      test: ["CMD", "php", "artisan", "payments:outbox:status"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 75s

  horizon:
    profiles: ["projection"]
    image: ${LEDGERFLOW_APP_IMAGE:-ledgerflow-app:latest}
    build:
      context: .
      target: dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/var/www/html
    # Above the 15s worker timeout, so SIGTERM lets Horizon finish the projection in flight.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
